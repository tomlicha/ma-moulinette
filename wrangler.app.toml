# L'application (site statique construit par Vite dans dist/), servie par Cloudflare Workers : `npm run deploy:app`.
# Le récepteur de journaux a sa propre configuration : wrangler.toml.
name = "ma-moulinette-ride"
main = "worker/app.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
# Seules les adresses /api/* passent par worker/app.ts (comptes, synchronisation, salle temps réel, passerelle Strava) ; le reste est servi directement.
run_worker_first = ["/api/*"]
# Une seule page : toute adresse inconnue renvoie index.html.
not_found_handling = "single-page-application"

# Comptes, sessions, jetons Strava et données synchronisées : même base que les journaux (migrations 0002 à 0004).
[[d1_databases]]
binding = "DB"
database_name = "ma-moulinette-logs"
database_id = "ed2eb97b-7694-4cbb-bb89-e4e9dd3bef73"
migrations_dir = "worker/migrations"

# Salle temps réel : un Durable Object par monde (worker/world-room.ts).
[[durable_objects.bindings]]
name = "WORLD"
class_name = "WorldRoom"

# Déclare explicitement l'export du Durable Object pour les déploiements Worker Previews.
[exports.WorldRoom]
type = "durable-object"
storage = "sqlite"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorldRoom"]

# Purge quotidienne des sessions expirées.
[triggers]
crons = ["30 3 * * *"]

# Aperçus de branche (Worker Previews : toute branche autre que main, construite par Cloudflare avec `wrangler preview`).
# Cloudflare lance `npx wrangler preview` sans `-c` pour ces branches : wrangler lirait wrangler.toml (le récepteur de
# journaux, un autre Worker, sans bloc [previews]) et le build échouait (constaté le 17 novembre 2026). `npm run build`
# écrit donc, dans Workers Builds seulement, `.wrangler/deploy/config.json` qui redirige vers ce fichier
# (tools/ci/wrangler-redirect.mjs). Réglage équivalent dans le tableau de bord (Settings > Build) : la commande de
# déploiement des branches `npx wrangler preview -c wrangler.app.toml`.
# Base D1 à part : un aperçu n'a jamais accès aux comptes ni aux jetons Strava de production. Création et migrations :
# voir wrangler.previews-db.toml. Chaque aperçu reçoit sa propre salle temps réel (Durable Object isolé, même classe).
[previews]

[[previews.d1_databases]]
binding = "DB"
database_name = "ma-moulinette-previews"
database_id = "f379dee9-5904-4d6c-a1a0-dac0fc638f19"
migrations_dir = "worker/migrations"

[[previews.durable_objects.bindings]]
name = "WORLD"
class_name = "WorldRoom"
