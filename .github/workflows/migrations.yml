# Migrations D1 appliquées à la base distante à chaque poussée.
#   - main : base de production (ma-moulinette-logs), puis base des aperçus (ma-moulinette-previews).
#   - autre branche : base des aperçus seulement. Jamais la production.
# Idempotent : sans nouvelle migration, wrangler répond « No migrations to apply ». Une migration en échec met le job en
# rouge et s'arrête ; elle est retentée à la poussée suivante, ou à la main (« Run workflow »).
#
# Secrets du dépôt (Settings > Secrets and variables > Actions) :
#   CLOUDFLARE_API_TOKEN   jeton Cloudflare : « D1 : modifier » pour les migrations, et « Workers Scripts : modifier »
#                          pour le déploiement du Worker de journaux (job deploy-logs)
#   CLOUDFLARE_ACCOUNT_ID  identifiant du compte Cloudflare
#
# Le Worker de l'application est déployé à part, chaque nuit à 2 h heure de Montréal (deploy-production.yml) : les migrations
# appliquées à la poussée passent donc avant le code neuf. Pour ne jamais avoir le code neuf avant sa migration : migrations additives
# d'abord (créer, ajouter ; jamais renommer ni supprimer dans la même version que le code qui s'en passe), voir README.
# Le Worker de journaux (wrangler.toml) est déployé ici, par le job deploy-logs, une fois la migration passée : il n'y a
# donc jamais de code neuf sans sa table.
name: Migrations D1

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Une seule série à la fois par cible : deux poussées rapprochées ne s'appliquent pas en même temps.
concurrency:
  group: migrations-${{ github.ref_name == 'main' && 'production' || 'apercus' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Sans secrets : sur main c'est une erreur (la production ne serait pas migrée en silence) ; ailleurs on passe
      # (poussée d'un robot de mise à jour, copie du dépôt sans secrets).
      - name: Secrets Cloudflare présents ?
        id: secrets
        run: |
          # Longueurs seulement, jamais les valeurs : 0 caractère = secret absent, vide ou hors de portée du dépôt.
          echo "CLOUDFLARE_API_TOKEN : ${#CLOUDFLARE_API_TOKEN} caractères ; CLOUDFLARE_ACCOUNT_ID : ${#CLOUDFLARE_ACCOUNT_ID} caractères"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID absents : la base de production n'a pas été migrée."
            exit 1
          else
            echo "::notice::Secrets Cloudflare absents : migrations ignorées."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.present == 'true'
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.present == 'true'
        with:
          node-version: 22

      - name: Base de production
        if: steps.secrets.outputs.present == 'true' && github.ref == 'refs/heads/main'
        run: npx --yes wrangler@4 d1 migrations apply ma-moulinette-logs --remote -c wrangler.app.toml

      - name: Base des aperçus
        if: steps.secrets.outputs.present == 'true'
        run: npx --yes wrangler@4 d1 migrations apply ma-moulinette-previews --remote -c wrangler.previews-db.toml

  # Récepteur de journaux (worker/index.ts, wrangler.toml) : seulement sur main, et seulement après la migration de la
  # production. Ses secrets (INGEST_TOKEN, READ_TOKEN) restent ceux déjà posés par `wrangler secret put` : un déploiement
  # ne les touche pas.
  deploy-logs:
    needs: migrate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npx --yes wrangler@4 deploy -c wrangler.toml
