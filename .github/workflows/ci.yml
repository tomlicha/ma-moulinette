# Garde-fou de chaque poussée : types, build de production, tests, poids du JS chargé au lancement, migrations D1 sur
# une base locale vierge. Les migrations sont appliquées aux bases distantes par migrations.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run budget
      # Le SQL de worker/migrations/ s'applique en entier sur une base vierge (une erreur de syntaxe est vue avant main).
      - run: npx --yes wrangler@4 d1 migrations apply ma-moulinette-logs --local --persist-to "$RUNNER_TEMP/d1" -c wrangler.app.toml
