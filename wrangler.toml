# Récepteur de journaux sur Cloudflare Workers + D1. Mise en route : voir « Journaux d'erreurs à distance » dans le README.
name = "ma-moulinette-logs"
main = "worker/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

# Domaine de l'application autorisé à déposer des rapports depuis un navigateur (CORS). `*` : tout le monde.
[vars]
ALLOWED_ORIGIN = "*"

# Purge quotidienne des rapports de plus de 30 jours.
[triggers]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ma-moulinette-logs"
database_id = "ed2eb97b-7694-4cbb-bb89-e4e9dd3bef73"
migrations_dir = "worker/migrations"
