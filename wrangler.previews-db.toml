# Base D1 des aperçus de branche (bloc [previews] de wrangler.app.toml). Ce fichier ne déploie rien : il ne sert qu'à
# appliquer les migrations à cette base, que `wrangler d1 migrations` ne trouve pas dans le bloc [previews].
#
#   npx wrangler d1 create ma-moulinette-previews          # une fois ; reporter l'identifiant ici et dans wrangler.app.toml
#   npx wrangler d1 migrations apply ma-moulinette-previews --remote -c wrangler.previews-db.toml
#
# À relancer après chaque nouvelle migration de worker/migrations/, comme pour la base de production.
name = "ma-moulinette-previews-db"

[[d1_databases]]
binding = "DB"
database_name = "ma-moulinette-previews"
database_id = "A_REMPLIR"
migrations_dir = "worker/migrations"
